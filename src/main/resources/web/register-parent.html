<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Registration - School Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-container {
            max-width: 550px;
            width: 100%;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }
        
        .auth-container h2 {
            text-align: center;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .info-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(102, 126, 234, 0.1) 100%);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        
        .info-box p {
            margin: 0;
            color: #1e40af;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .info-box strong {
            color: #667eea;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .auth-link p {
            color: #4b5563;
            font-size: 0.95em;
            margin: 8px 0;
        }
        
        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }
        
        .auth-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        
        .auth-link a:hover::after {
            width: 100%;
        }
        
        .auth-link a:hover {
            color: #764ba2;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Parent Registration</h2>
    <div class="info-box">
        <p><strong>Note:</strong> After registration, please contact an administrator to link your account to your child's student account.</p>
    </div>
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>User ID:</label>
            <input type="text" id="userId" required>
        </div>
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" required>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%;">Register as Parent</button>
        <div id="registerResult" class="result"></div>
    </form>
    <div class="auth-link">
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <p><a href="register.html">Register as Student instead</a></p>
    </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';

async function handleRegister(event) {
    event.preventDefault();
    const resultDiv = document.getElementById('registerResult');
    resultDiv.className = 'result';
    resultDiv.style.display = 'none';

    const data = {
        userId: document.getElementById('userId').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        userType: 'parent'
    };

    try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            localStorage.setItem('user', JSON.stringify({
                userId: result.userId,
                firstName: result.firstName,
                lastName: result.lastName,
                name: result.name,
                email: result.email,
                roles: result.roles
            }));
            
            window.location.href = 'dashboard.html';
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `<strong>✗ Error:</strong> ${result.error}`;
            resultDiv.style.display = 'block';
        }
    } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<strong>✗ Error:</strong> ${error.message}`;
        resultDiv.style.display = 'block';
    }
}
</script>
</body>
</html>

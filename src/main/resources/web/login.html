<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-container {
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }
        
        .auth-container h2 {
            text-align: center;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .auth-link p {
            color: #4b5563;
            font-size: 0.95em;
        }
        
        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }
        
        .auth-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        
        .auth-link a:hover::after {
            width: 100%;
        }
        
        .auth-link a:hover {
            color: #764ba2;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
        <div id="loginResult" class="result"></div>
    </form>
    <div class="auth-link">
        <p>Don't have an account? <a href="register.html">Register as Student</a> | <a href="register-parent.html">Register as Parent</a></p>
    </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';

async function handleLogin(event) {
    event.preventDefault();
    const resultDiv = document.getElementById('loginResult');
    resultDiv.className = 'result';
    resultDiv.style.display = 'none';

    const data = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            // Store user info in localStorage (including numeric primary key id for messaging)
            localStorage.setItem('user', JSON.stringify({
                id: result.id,
                userId: result.userId,
                firstName: result.firstName,
                lastName: result.lastName,
                name: result.name,
                email: result.email,
                roles: result.roles
            }));
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `<strong>✗ Error:</strong> ${result.error}`;
            resultDiv.style.display = 'block';
        }
    } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<strong>✗ Error:</strong> ${error.message}`;
        resultDiv.style.display = 'block';
    }
}
</script>
</body>
</html>

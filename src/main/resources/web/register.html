<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - School Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
        }
        .auth-link a {
            color: #3498db;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        #studentFields, #staffFields {
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <h2>Register</h2>
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>User Type:</label>
            <select id="userType" onchange="toggleFields()" required>
                <option value="">Select user type</option>
                <option value="student">Student</option>
                <option value="staff">Staff/Teacher</option>
                <option value="admin">Admin</option>
                <option value="advisor">Advisor</option>
            </select>
        </div>
        <div class="form-group">
            <label>User ID:</label>
            <input type="text" id="userId" required>
        </div>
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" required>
        </div>
        
        <div id="studentFields">
            <div class="form-group">
                <label>Major:</label>
                <input type="text" id="major">
            </div>
        </div>
        
        <div id="staffFields">
            <div class="form-group">
                <label>Department:</label>
                <input type="text" id="department">
            </div>
            <div class="form-group">
                <label>Position:</label>
                <input type="text" id="position">
            </div>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
        <div id="registerResult" class="result"></div>
    </form>
    <div class="auth-link">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';

function toggleFields() {
    const userType = document.getElementById('userType').value;
    const studentFields = document.getElementById('studentFields');
    const staffFields = document.getElementById('staffFields');
    
    studentFields.style.display = (userType === 'student') ? 'block' : 'none';
    staffFields.style.display = (userType === 'staff' || userType === 'teacher') ? 'block' : 'none';
}

async function handleRegister(event) {
    event.preventDefault();
    const resultDiv = document.getElementById('registerResult');
    resultDiv.className = 'result';
    resultDiv.style.display = 'none';

    const userType = document.getElementById('userType').value;
    const data = {
        userId: document.getElementById('userId').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        userType: userType
    };

    if (userType === 'student') {
        data.major = document.getElementById('major').value;
    } else if (userType === 'staff' || userType === 'teacher') {
        data.department = document.getElementById('department').value;
        data.position = document.getElementById('position').value;
    }

    try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            // Store user info
            localStorage.setItem('user', JSON.stringify({
                userId: result.userId,
                firstName: result.firstName,
                lastName: result.lastName,
                name: result.name,
                email: result.email,
                roles: result.roles
            }));
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `<strong>✗ Error:</strong> ${result.error}`;
            resultDiv.style.display = 'block';
        }
    } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<strong>✗ Error:</strong> ${error.message}`;
        resultDiv.style.display = 'block';
    }
}
</script>
</body>
</html>
